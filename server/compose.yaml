services:
  db:
    image: docker.io/mariadb:10.11
    container_name: attending_tracker_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpMyAdmin:
    image: docker.io/phpmyadmin:latest
    container_name: attending_tracker_phpmyadmin
    restart: always
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db

  php-app:
    image: docker.io/php:8.2-apache
    container_name: attending_tracker_php_server
    ports:
      - "8081:80"                     
    volumes:
      - ./src:/var/www/html:Z
    depends_on:
      - db                            

volumes:
  db_data:                            
